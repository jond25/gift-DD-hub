name: Gift'DD Sync Queue

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# System Permissions
permissions:
  contents: read
  pages: write
  id-token: write

# THE STRICT TRAFFIC CONTROLLER
# We use a hard-coded string 'global_pages_queue' to ensure every 
# single push to this repo joins the exact same line.
concurrency:
  group: 'global_pages_queue'
  cancel-in-progress: false 

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull Latest Data
        uses: actions/checkout@v4

      - name: 2. Initialize System Sequence
        run: |
          echo ">> ARCHIVE ID: ${{ github.sha }}"
          echo ">> QUEUE STATUS: ACTIVE. PROCEEDING TO EXECUTION."

      - name: 3. Setup Pages
        uses: actions/configure-pages@v4

      - name: 4. Package Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 5. Execute Deployment
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 6. Finalize & Signal Next Job
        run: |
          echo ">> SUCCESSION SIGNAL SENT."
          echo ">> TERMINATING CURRENT RUN TO CLEAR PATH FOR SUCCESSOR."
