<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | gift'DD Lawncare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 18px; background: #198754; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s; }
        .gallery img:hover { transform: scale(1.02); }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Lawn Home</a>
    <div class="gallery">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6024.jpg">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6027.jpg">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6020.PNG">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6023.PNG">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6033.jpg">
        <img src="https://jond25.github.io/ddynastia.com/IMG_6026.jpg">
    </div>

    <div class="text-center mt-5">
        <a href="index.html#quote-form" class="btn btn-warning btn-lg px-5 shadow">Get Your Estimate Now!</a>
    </div>

    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <footer class="mt-5 pt-4 text-center border-top" style="font-size: 0.7rem; color: #777;">
        <p>Copyright © 2025 Gift'DD Consultant Services. All Rights Reserved.</p>
    </footer>

    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        document.querySelectorAll(".gallery img").forEach(img => {
            img.addEventListener("click", () => {
                lightboxImg.src = img.src;
                lightbox.style.display = "flex";
            });
        });
    </script>
</body>
</html>
