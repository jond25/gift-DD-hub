<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gift'DD Lawncare | Keep The Snakes Out Your Grass!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- 1. HUB NAVIGATION (Navy/Neon) --- */
        :root {
            --hub-navy: #0A192F;
            --hub-neon: #00FFC0;
        }

        .top-bar {
            background-color: var(--hub-navy);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 2000; /* Stays above Bootstrap nav */
            border-bottom: 1px solid rgba(0, 255, 192, 0.2);
        }

        .back-hub {
            color: var(--hub-neon);
            text-decoration: none;
            border: 1px solid var(--hub-neon);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .back-hub:hover { background: var(--hub-neon); color: var(--hub-navy); }

        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .hamburger span { display: block; width: 25px; height: 3px; background: var(--hub-neon); transition: 0.3s; }

        .menu-panel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
            background: var(--hub-navy); z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.5s ease-in-out;
        }
        @media (min-width: 768px) { .menu-panel { width: 350px; right: -350px; } }
        body.menu-open { overflow: hidden; }
        body.menu-open .menu-panel { right: 0; }
        
        .menu-link { color: white; text-decoration: none; font-size: 1.5rem; margin: 15px 0; text-transform: uppercase; }
        .menu-link:hover { color: var(--hub-neon); }

        /* --- 2. ORIGINAL LAWN CARE STYLES --- */
        .jumbotron {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1533467647142-f4639d731bc9?q=80&w=2070&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            color: white;
            padding: 8rem 0;
            text-shadow: 2px 2px 4px #000000;
        }
        .section-padding { padding: 4rem 0; }
        .card-service { transition: transform 0.3s ease-in-out; }
        .card-service:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,.1); }
        .garden-alert { background-color: #d1e7dd; border-color: #badbcc; color: #0f5132; }
    </style>
</head>
<body id="mainBody">

    <div class="top-bar">
        <a href="https://ddynastia.com" class="back-hub">Back to Hub</a>
        <div class="fw-bold text-white">Gift'DD Hub</div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <nav class="menu-panel">
        <a href="/creative/" class="menu-link">Staying in Lane</a>
