<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Tees – Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        a {
            color: #198754;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            color: #198754;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 40px;
            color: #198754;
        }

        /* Image grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery-grid img {
            width: 100%;
            border-radius: 8px;
            transition: transform 0.25s ease;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
        }

        /* Video section */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-grid video {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
