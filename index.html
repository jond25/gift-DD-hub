<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design for Impact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --color-primary: #0A192F; 
            --color-secondary: #00FFC0; 
            --color-light: #F4F4F9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--color-primary);
            color: var(--color-light);
            font-family: sans-serif;
        }

        /* HEADER */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(10, 25, 47, 0.9);
            border-bottom: 1px solid var(--color-secondary);
            z-index: 1000;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--color-secondary);
        }

        /* MENU TOGGLE BUTTON */
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: var(--color-secondary);
        }

        /* HERO SECTION */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: var(--color-light);
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: var(--color-secondary);
            margin-bottom: 30px;
        }

        .cta {
            padding: 15px 30px;
            background: var(--color-secondary);
            color: var(--color-primary);
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        /* SLIDE OUT MENU */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #112240;
            padding: 50px 20px;
            transition: 0.3s;
            z-index: 2000;
        }

        body.menu-open .menu-panel {
            right: 0;
        }

        .menu-link {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">Design for Impact</div>
        <div class="hamburger" onclick="document.body.classList.toggle('menu-open')">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <nav class="menu-panel">
        <a href="#" class="menu-link">Staying in Lane</a>
        <a href="#" class="menu-link">Style</a>
        <a href="#" class="menu-link">Lawn Care</a>
        <a href="#" class="menu-link" onclick="document.body.classList.remove('menu-open')">Close Menu</a>
    </nav>

    <section class="hero">
        <h1>Design & Code That Converts</h1>
        <p>Your Vision, Digitally Gifted.</p>
        <a href="#" class="cta">Start Your Project Today</a>
    </section>

</body>
</html>
