<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staying In Lane | Gift'DD</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- 1. NEW HAMBURGER & HUB NAV CSS --- */
        :root {
            --hub-navy: #0A192F;
            --hub-neon: #00FFC0;
        }

        .top-bar {
            background-color: var(--hub-navy);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 2000;
        }

        /* Turning the link into a Button */
        .back-hub {
            color: var(--hub-neon) !important;
            text-decoration: none;
            border: 1px solid var(--hub-neon);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-hub:hover {
            background: var(--hub-neon);
            color: var(--hub-navy) !important;
        }

        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: var(--hub-neon);
        }

        /* HIDDEN MENU PANEL */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background: var(--hub-navy);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.4s ease-in-out;
        }

        /* When active, slide it in */
        body.menu-open .menu-panel {
            right: 0;
        }

        .menu-link {
            color: white !important;
            text-decoration: none;
            font-size: 1.2rem;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* --- 2. EXISTING LANE STYLES (Kept exactly as yours) --- */
        .lane-container {
            padding: 30px 15px;
            background-color: #f7f7f7;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .header-section { background-color: #1a73e8; color: white; padding: 60px 0; }
        .card-modern { border-left: 5px solid #1a73e8; border-radius: 8px; transition: 0.3s; }
        
        /* Spinner & Popup (Restored) */
        .spinner { border: 4px solid #ddd; border-top: 4px solid #198754; border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body id="mainBody">

    <div class="top-bar">
        <a href="https://ddynastia.com" class="back-hub">Back to Hub</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <nav class="menu-panel">
        <a href="/creative/" class="menu-link" style="color: var(--hub-neon) !important;">Staying in Lane</a>
        <a href="/designDDtees/" class="menu-link">Style</a>
        <a href="/lawn/" class="menu-link">Lawn Care</a>
        <a href="/sample-sites.html" class="menu-link">Sample Sites</a>
        <a href="#" class="menu-link" onclick="toggleMenu()" style="font-size: 0.8rem; margin-top: 20px;">[ CLOSE ]</a>
    </nav>

    <div class="lane-container">
        </div>

    <script>
        function toggleMenu() {
            document.body.classList.toggle('menu-open');
        }
    </script>
</body>
</html>
