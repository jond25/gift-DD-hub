<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staying In Lane | Focus, Flow & Strategic Impact Service</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Fira+Code:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. GLOBAL THEME & VARIABLES --- */
        :root {
            --hub-navy: #0A192F;
            --hub-neon: #00FFC0;
            --lane-blue: #1a73e8;
            --term-bg: #112240;
            --term-text: #abb2bf;
            --primary-color: #A3A3FF; 
            --font-main: 'Montserrat', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        /* Base Reset */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #F4F4F9;
            color: #333;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4 { 
            font-family: var(--font-main); 
            font-weight: 800; 
        }

        /* --- 2. NAVIGATION OVERLAY --- */
        .floating-burger {
            position: fixed; 
            top: 25px; 
            right: 25px; 
            z-index: 5000;
            background: var(--hub-navy); 
            width: 55px; 
            height: 55px;
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 192, 0.4); 
            border: 2px solid var(--hub-neon);
        }

        .floating-burger span { 
            display: block; 
            width: 28px; 
            height: 3px; 
            background-color: var(--hub-neon); 
            margin: 3px 0; 
            transition: 0.3s; 
        }

        .menu-panel {
            position: fixed; 
            top: 0; 
            right: -100%; 
            width: 320px; 
            height: 100vh;
            background: var(--hub-navy); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            transition: 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
            z-index: 6000; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            border-left: 2px solid var(--hub-neon);
        }

        body.menu-open .menu-panel { 
            right: 0; 
        }

        .menu-link { 
            font-size: 1.2rem; 
            color: white; 
            text-decoration: none; 
            margin: 15px 0; 
            text-transform: uppercase; 
            font-weight: bold; 
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .menu-link:hover { 
            color: var(--hub-neon); 
            padding-left: 10px; 
        }

        .menu-link-muted {
            color: rgba(255,255,255,0.2);
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: 800;
            margin: 12px 0;
            font-style: italic;
            cursor: default;
        }

        /* --- 3. HERO SECTION (BLUEPRINT THEME) --- */
        .hero-lane {
            min-height: 85vh;
            background: linear-gradient(rgba(26, 115, 232, 0.9), rgba(10, 25, 47, 0.95)), 
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-align: center; 
            padding: 100px 20px;
            position: relative;
        }

        .hero-lane h1 { 
            font-size: 5rem; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            letter-spacing: -2px;
            line-height: 1;
        }

        /* --- 4. THE THREE PILLARS --- */
        .section-padding { 
            padding: 100px 0; 
        }

        .card-modern { 
            border: none; 
            border-left: 5px solid var(--lane-blue); 
            transition: all 0.4s ease; 
            background: white; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            height: 100%; 
        }

        .card-modern:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
        }

        /* --- 5. THE CREATIVE WORKFLOW --- */
        .workflow-step { 
            border-left: 3px solid var(--primary-color); 
            padding-left: 2.5rem; 
            margin-bottom: 4rem; 
            position: relative; 
        }

        .workflow-step::before {
            content: attr(data-step); 
            position: absolute; 
            left: -22px; 
            top: 0;
            background: var(--primary-color); 
            color: #000; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* --- 6. THE TERMINAL (BLUEPRINT DATA) --- */
        .terminal-window { 
            background-color: var(--term-bg); 
            border-radius: 12px; 
            padding: 50px; 
            font-family: var(--font-code); 
            color: var(--term-text); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1); 
            position: relative;
        }

        .terminal-header { 
            color: #61afef; 
            border-bottom: 2px solid #56b6c2; 
            padding-bottom: 20px; 
            margin-bottom: 35px; 
            font-weight: bold; 
        }

        .lane-item { 
            border-left: 4px solid; 
            padding: 25px; 
            margin: 30px 0; 
            background: rgba(255,255,255,0.02); 
            transition: 0.3s; 
        }

        .lane-item:hover { 
            transform: translateX(10px); 
            background: rgba(97, 175, 239, 0.08); 
        }

        .lane-analytical { border-color: #e5c07b; }
        .lane-creative { border-color: #98c379; }
        .lane-technical { border-color: #61afef; }
        .lane-relational { border-color: #c678dd; }
        .lane-operational { border-color: #e06c75; }

        /* --- 7. ACTION PLAN ACCORDION --- */
        .accordion-item { border: none; margin-bottom: 15px; border-radius: 8px !important; overflow: hidden; }
        
        .accordion-button { 
            font-weight: 700; 
            color: var(--hub-navy); 
            border-left: 6px solid #f90; 
            padding: 25px;
            font-size: 1.1rem;
        }

        .accordion-button:not(.collapsed) { 
            background-color: #e6f0ff; 
            color: var(--lane-blue); 
            border-left: 6px solid var(--lane-blue); 
        }

        /* --- 8. CONTACT TERMINAL & SUCCESS GUI --- */
        .contact-terminal { 
            background: #0f172a; 
            color: white; 
            padding: 120px 0; 
        }

        .form-terminal input, 
        .form-terminal textarea { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: var(--hub-neon); 
            font-family: var(--font-code); 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 5px;
        }

        .form-terminal input:focus, 
        .form-terminal textarea:focus {
            background: #232f45;
            border-color: var(--hub-neon);
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 192, 0.3);
        }

        .btn-terminal { 
            background: var(--hub-neon); 
            color: var(--hub-navy); 
            font-weight: 900; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            transition: 0.4s; 
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
        }

        .btn-terminal:hover { 
            filter: brightness(1.2); 
            letter-spacing: 4px; 
            transform: translateY(-3px);
        }

        /* Success GUI Overlay */
        #success-gui {
            display: none;
            text-align: center;
            padding: 80px 4
