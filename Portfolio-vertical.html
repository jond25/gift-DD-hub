<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Sites | Design for Impact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --color-primary: #0A192F; 
            --color-secondary: #00FFC0; 
            --color-accent: #3A86FF; 
            --color-light: #F4F4F9;
            --font-main: 'Arial', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            color: var(--color-light);
            background-color: var(--color-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 2. THE TOP BAR --- */
        header {
            background-color: rgba(10, 25, 47, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(0, 255, 192, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .back-hub {
            color: var(--color-secondary);
            border: 1px solid var(--color-secondary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-hub:hover { background: var(--color-secondary); color: var(--color-primary); }

        .logo { font-size: 1.4em; font-weight: 900; color: var(--color-secondary); }

        /* HAMBURGER ICON */
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 18px;
        }

        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--color-secondary);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* --- 3. THE SLIDE-OUT PANEL --- */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -100%; /* Hidden by default */
            width: 100%;
            height: 100vh;
            background-color: var(--color-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
            z-index: 2000;
        }

        /* Desktop width adjustment for the panel */
        @media (min-width: 768px) {
            .menu-panel { width: 350px; right: -350px; border-left: 1px solid rgba(0, 255, 192, 0.1); }
        }

        body.menu-open .menu-panel { right: 0; }

        .menu-link {
            font-size: 1.5rem;
            color: var(--color-light);
            text-decoration: none;
            margin: 15px 0;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }
        .menu-link:hover { color: var(--color-secondary); }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 2rem;
            color: var(--color-secondary);
            cursor: pointer;
        }

        /* --- 4. CONTENT GRID --- */
        .content-area {
            padding: 100px 20px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 { font-size: 2.5em; margin-bottom: 10px; color: var(--color-light); }
        p.subtitle { color: var(--color-secondary); margin-bottom: 50px; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .site-card {
            background: #112240;
            padding: 50px 30px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--color-light);
            border-top: 4px solid transparent;
            transition: 0.4s;
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
        }

        .site-card:hover {
            transform: translateY(-10px);
            border-top-color: var(--color-secondary);
            background: #1d2d50;
        }

        .site-card h3 { color: var(--color-secondary); margin-bottom: 10px; font-size: 1.4rem; }
    </style>
</head>
<body id="body">

    <header>
        <nav>
            <a href="https://ddynastia.com" class="back-hub">Back to Hub</a>
            <div class="logo">Portfolio</div>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <nav class="menu-panel" id="menuPanel">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <a href="/creative/" class="menu-link">Staying in Lane</a>
        <a href="/designDDtees/" class="menu-link">Style</a>
        <a href="/lawn/" class="menu-link">Lawn Care</a>
        <a href="/sample-sites.html" class="menu-link" style="color: var(--color-secondary);">Portfolio Home</a>
    </nav>

    <main class="content-area">
        <h1>Our Live Work</h1>
        <p class="subtitle">Experience the "Digital Gift" in Action</p>

        <div class="grid">
            <a href="/creative/" class="site-card">
                <h3>Staying in Lane</h3>
                <p>Creative UX & Brand Strategy</p>
            </a>
            <a href="/designDDtees/" class="site-card">
                <h3>Style</h3>
                <p>Fashion & Digital Merchandise</p>
            </a>
            <a href="/lawn/" class="site-card">
                <h3>Lawn Care</h3>
                <p>Service-Based Business Solution</p>
            </a>
        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('body').classList.toggle('menu-open');
        }
    </script>

</body>
</html>
