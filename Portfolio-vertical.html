<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sample Sites</title>

  <style>
    .nav {
      height: 60px;
      width: 100%;
      background: #198754;
      position: relative;
    }

    .nav-header {
      display: inline-block;
    }

    .nav-title {
      font-size: 22px;
      color: #fff;
      padding: 18px;
    }

    .nav-btn {
      display: none;
    }

    .nav-links {
      display: inline-block;
      float: right;
      padding-right: 20px;
    }

    .nav-links a {
      display: inline-block;
      padding: 18px;
      color: #fff;
      text-decoration: none;
    }

    #nav-check {
      display: none;
    }

    /* You will also need the rest of the CSS I gave you earlier */
  </style>
</head>

<body>

  <!-- Your HTML content goes here -->
  <nav class="nav">…</nav>

  <div class="section-list">…</div>

  <div class="coming-soon-container">…</div>

</body>
</html>
